<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 배경 원 -->
  <rect width="32" height="32" rx="8" fill="#6366f1"/>
  <!-- 칸반 보드: 왼쪽 컬럼 -->
  <rect x="5" y="8" width="6" height="12" rx="2" fill="white" opacity="0.9"/>
  <!-- 칸반 보드: 가운데 컬럼 (더 짧음) -->
  <rect x="13" y="8" width="6" height="8" rx="2" fill="white" opacity="0.9"/>
  <!-- 칸반 보드: 오른쪽 컬럼 -->
  <rect x="21" y="8" width="6" height="10" rx="2" fill="white" opacity="0.9"/>
  <!-- 하단 바 -->
  <rect x="5" y="22" width="22" height="2" rx="1" fill="white" opacity="0.4"/>
</svg>
