<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 노트 배경 -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5" fill="#f5eedd" stroke="#e0d3be" stroke-width="0.8"/>
  <!-- N 왼쪽 바 -->
  <path d="M5,8 L5,24" stroke="#5c4d3c" stroke-width="2" stroke-linecap="round"/>
  <!-- N 대각선 -->
  <path d="M5,8 L16,24" stroke="#5c4d3c" stroke-width="2" stroke-linecap="round"/>
  <!-- T 스템 = N 오른쪽 바 (공유) -->
  <path d="M16,8 L16,24" stroke="#5c4d3c" stroke-width="2" stroke-linecap="round"/>
  <!-- T 크로스바 (N 왼쪽 바에 닿지 않음) -->
  <path d="M10.5,8 L21,8" stroke="#5c4d3c" stroke-width="2" stroke-linecap="round"/>
  <!-- o (하단 정렬, NT에 바짝) -->
  <circle cx="23.5" cy="19.5" r="4.5" stroke="#5c4d3c" stroke-width="2" fill="none"/>
</svg>
